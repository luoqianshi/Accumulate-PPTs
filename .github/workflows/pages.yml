name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate slides manifest
        shell: python
        run: |
          import datetime
          import html
          import json
          import pathlib
          import re

          root = pathlib.Path.cwd()
          slides_dir = root / "paper-slides"
          title_pattern = re.compile(r"<title[^>]*>(.*?)</title>", re.I | re.S)

          def title_from_file(path):
              text = path.read_text(encoding="utf-8", errors="ignore")
              match = title_pattern.search(text)
              if match:
                  return html.unescape(re.sub(r"\s+", " ", match.group(1))).strip()
              return path.stem.replace("_", " ").replace("-", " ").title()

          # Preserve manually curated metadata (title/description/kind/accent/
          # thumbnail) from the committed manifest; only brand-new files fall
          # back to auto-discovered defaults.
          curated = {}
          manifest_path = root / "slides-manifest.json"
          if manifest_path.exists():
              try:
                  existing = json.loads(manifest_path.read_text(encoding="utf-8"))
                  entries = existing if isinstance(existing, list) else existing.get("slides", [])
                  curated = {
                      entry.get("file"): entry
                      for entry in entries
                      if isinstance(entry, dict) and entry.get("file")
                  }
              except (json.JSONDecodeError, OSError):
                  curated = {}

          slides = []
          for index, path in enumerate(sorted(slides_dir.glob("*.html"), key=lambda item: item.name.lower())):
              rel = path.relative_to(root).as_posix()
              kept = curated.get(rel, {})
              slides.append({
                  "title": kept.get("title") or title_from_file(path),
                  "file": rel,
                  "description": kept.get("description") or "从 paper-slides 目录自动发现的 HTML 格式 PPT，可直接嵌入放映或打开原页。",
                  "kind": kept.get("kind") or "HTML PPT",
                  "accent": kept.get("accent") or ("rgba(93,112,82,.2)" if index % 2 == 0 else "rgba(193,140,93,.22)"),
                  **({"thumbnail": kept["thumbnail"]} if kept.get("thumbnail") else {})
              })

          manifest = {
              "generatedAt": datetime.datetime.now(datetime.UTC).isoformat(),
              "slides": slides
          }
          (root / "slides-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

      - name: Generate blogs manifest
        shell: python
        run: |
          import datetime
          import json
          import pathlib
          import re

          root = pathlib.Path.cwd()
          blogs_dir = root / "paper-blogs"
          fm_pattern = re.compile(r"^---\s*\n(.*?)\n---\s*\n", re.S)
          img_pattern = re.compile(r"!\[[^\]]*\]\(([^)\s]+)")

          def fm_value(fm, key):
              match = re.search(rf"^{key}:\s*(.+?)\s*$", fm, re.M)
              return match.group(1).strip('"').strip("'") if match else ""

          blogs = []
          for path in sorted(blogs_dir.glob("*.md")):
              text = path.read_text(encoding="utf-8")
              match = fm_pattern.match(text)
              if not match:
                  print(f"skip {path.name}: no front matter")
                  continue
              fm = match.group(1)
              body = text[match.end():]
              img = img_pattern.search(body)
              thumbnail = re.sub(r"^\.\./", "", img.group(1)) if img else ""
              blogs.append({
                  "title": fm_value(fm, "title"),
                  "file": path.relative_to(root).as_posix(),
                  "category": fm_value(fm, "category"),
                  "date": fm_value(fm, "date"),
                  "source_url": fm_value(fm, "source_url"),
                  "thumbnail": thumbnail
              })

          blogs.sort(key=lambda item: item["date"], reverse=True)
          manifest = {
              "generatedAt": datetime.datetime.now(datetime.UTC).isoformat(),
              "blogs": blogs
          }
          (root / "blogs-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Delete stale Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' || true)
          if [ -n "$ids" ]; then
            for id in $ids; do
              gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id" \
                && echo "deleted stale artifact $id" || true
            done
          else
            echo "no stale github-pages artifact"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
